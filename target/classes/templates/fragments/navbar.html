<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-dark" style="background: #1a1a2e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🏔️ Winter Olympics</a>
        <div class="d-flex gap-2">
            <a href="/api/athletes/view" class="btn btn-outline-light btn-sm">Athletes</a>
            <a href="/api/register/view" class="btn btn-outline-light btn-sm"
               th:if="${isLoggedIn == null or !isLoggedIn}">Register</a>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm"
               th:if="${isAdmin != null and isAdmin}">Admin</a>
            <a href="/login" class="btn btn-outline-light btn-sm"
               th:if="${isLoggedIn == null or !isLoggedIn}">Login</a>
            <form th:action="@{/logout}" method="post" style="display:inline"
                  th:if="${isLoggedIn != null and isLoggedIn}">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
