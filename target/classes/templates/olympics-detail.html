<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Olympics Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .header { background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white; padding: 40px 0; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .stat-card { background: white; border-radius: 12px;
            padding: 20px; text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .stat-number { font-size: 2rem; font-weight: bold; color: #0f3460; }
        .comp-card { border-left: 4px solid #0f3460; border-radius: 8px;
            background: white; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
<div class="header text-center">
    <h1 class="fw-bold" th:text="${olympics.name}"></h1>
    <p class="lead" th:text="'Year: ' + ${olympics.year}"></p>
    <a href="/" class="btn btn-outline-light">← Back</a>
</div>

<div class="container">
    <!-- Stats row -->
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="text-muted mb-1">Average age</div>
                <div class="stat-number"
                     th:text="${#numbers.formatDecimal(averageAge, 1, 1)}"></div>
            </div>
        </div>
        <div class="col-md-4" th:if="${medalistAges['youngest'] != null}">
            <div class="stat-card">
                <div class="text-muted mb-1">🥇 Youngest medalist</div>
                <div class="fw-bold fs-5"
                     th:text="${medalistAges['youngest'].name}"></div>
                <div class="text-muted"
                     th:text="${medalistAges['youngest'].country}"></div>
            </div>
        </div>
        <div class="col-md-4" th:if="${medalistAges['oldest'] != null}">
            <div class="stat-card">
                <div class="text-muted mb-1">🎖️ Oldest medalist</div>
                <div class="fw-bold fs-5"
                     th:text="${medalistAges['oldest'].name}"></div>
                <div class="text-muted"
                     th:text="${medalistAges['oldest'].country}"></div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Medal count -->
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-dark text-white fw-bold">
                    🏅 Medal count by country
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr><th>Country</th><th class="text-center">Medals</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${medals}">
                            <td th:text="${entry.key}"></td>
                            <td class="text-center">
                                    <span class="badge bg-warning text-dark fw-bold"
                                          th:text="${entry.value}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#maps.size(medals) == 0}">
                            <td colspan="2" class="text-muted text-center">No medals yet</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Competitions -->
        <div class="col-md-7">
            <h5 class="fw-bold mb-3">Competitions</h5>
            <div class="d-flex flex-column gap-3">
                <div class="comp-card" th:each="c : ${olympics.competitions}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold" th:text="${c.name}"></div>
                            <div class="mt-1">
                                <span class="badge bg-dark me-1" th:text="${c.type}"></span>
                                <span class="badge bg-secondary me-1" th:text="${c.gender}"></span>
                                <span class="badge bg-light text-dark"
                                      th:text="'Min age: ' + ${c.minAge}"></span>
                            </div>
                        </div>
                        <a th:href="@{/api/slalom/{id}/ranking/view(id=${c.id})}"
                           th:if="${c.type.name() == 'SLALOM'}"
                           class="btn btn-sm btn-outline-dark">Rankings →</a>
                        <a th:href="@{/api/biathlon/{id}/ranking/view(id=${c.id})}"
                           th:if="${c.type.name() == 'BIATHLON'}"
                           class="btn btn-sm btn-outline-dark">Rankings →</a>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(olympics.competitions)}"
                     class="text-muted">No competitions yet.</div>
            </div>
        </div>
    </div>
</div>
</body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
</html>
