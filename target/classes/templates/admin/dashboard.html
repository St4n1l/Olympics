<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .header { background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white; padding: 40px 0; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
    </style>
</head>
<body>
<div class="header text-center">
    <h1 class="fw-bold">⚙️ Admin Dashboard</h1>
    <p class="lead">Manage the Winter Olympics</p>
    <a href="/api/olympics/view" class="btn btn-outline-light">← Public view</a>
</div>
<div class="container">
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body text-center p-4">
                    <div class="fs-1 mb-3">🏔️</div>
                    <h5 class="fw-bold">Olympics</h5>
                    <p class="text-muted small">Create a new Olympic games</p>
                    <a href="/admin/olympics/create" class="btn btn-dark w-100">Create</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body text-center p-4">
                    <div class="fs-1 mb-3">🏁</div>
                    <h5 class="fw-bold">Competition</h5>
                    <p class="text-muted small">Add a competition to an Olympics</p>
                    <a href="/admin/competitions/create" class="btn btn-dark w-100">Create</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body text-center p-4">
                    <div class="fs-1 mb-3">⛷️</div>
                    <h5 class="fw-bold">Slalom results</h5>
                    <p class="text-muted small">Enter run times for slalom</p>
                    <a href="/admin/slalom/results" class="btn btn-dark w-100">Enter</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body text-center p-4">
                    <div class="fs-1 mb-3">🎯</div>
                    <h5 class="fw-bold">Biathlon results</h5>
                    <p class="text-muted small">Enter biathlon times and shots</p>
                    <a href="/admin/biathlon/results" class="btn btn-dark w-100">Enter</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
