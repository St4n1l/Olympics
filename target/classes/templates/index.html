<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Winter Olympics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .hero { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white; padding: 60px 0; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .badge-slalom { background-color: #0f3460; }
        .badge-biathlon { background-color: #1a6b3c; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="hero text-center">
    <h1 class="display-4 fw-bold">🏔️ Winter Olympics</h1>
    <p class="lead">Official Results & Rankings</p>
    <a href="/api/athletes/view" class="btn btn-outline-light me-2">Athletes</a>
    <a href="/api/register/view" class="btn btn-light">Register as Athlete</a>
</div>

<div class="container">
    <h3 class="mb-4 fw-bold">Olympic Games</h3>
    <div class="row g-4" th:if="${not #lists.isEmpty(olympics)}">
        <div class="col-md-4" th:each="o : ${olympics}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${o.name}"></h5>
                    <p class="text-muted" th:text="'Year: ' + ${o.year}"></p>
                    <p class="text-muted" th:text="'Competitions: ' + ${#lists.size(o.competitions)}"></p>
                    <a th:href="@{/api/olympics/{id}/view(id=${o.id})}"
                       class="btn btn-dark w-100">View Details</a>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(olympics)}" class="text-center py-5 text-muted">
        <h4>No Olympics yet.</h4>
    </div>
</div>
</body>
</html>
