<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Athletes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .header { background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white; padding: 40px 0; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .avatar { width: 40px; height: 40px; border-radius: 50%;
            background: #0f3460; color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; }
    </style>
</head>
<body>
<div class="header text-center">
    <h1 class="fw-bold">🏅 Athletes</h1>
    <a href="/" class="btn btn-outline-light mt-2">← Back</a>
</div>
<div class="container">
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Athlete</th>
                    <th>Country</th>
                    <th>Gender</th>
                    <th>Date of Birth</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a, i : ${athletes}">
                    <td class="align-middle" th:text="${i.count}"></td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center gap-2">
                            <div class="avatar"
                                 th:text="${#strings.substring(a.name, 0, 1)}"></div>
                            <span th:text="${a.name}"></span>
                        </div>
                    </td>
                    <td class="align-middle" th:text="${a.country}"></td>
                    <td class="align-middle">
                            <span class="badge"
                                  th:classappend="${a.gender.name() == 'MALE'} ? 'bg-primary' : 'bg-danger'"
                                  th:text="${a.gender}"></span>
                    </td>
                    <td class="align-middle" th:text="${a.dateOfBirth}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
