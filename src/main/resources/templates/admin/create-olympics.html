<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Olympics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4">
                <h2 class="fw-bold">🏔️ Create Olympics</h2>
            </div>
            <div class="card">
                <div class="card-body p-4">
                    <div id="alert" class="alert d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="name" class="form-control"
                               placeholder="Winter Olympics 2026"/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Year</label>
                        <input type="number" id="year" class="form-control"
                               placeholder="2026"/>
                    </div>
                    <button class="btn btn-dark w-100" onclick="create()">Create</button>
                    <div class="text-center mt-3">
                        <a href="/admin/dashboard" class="text-muted">← Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    async function create() {
        const res = await fetch('/api/olympics', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('name').value,
                year: parseInt(document.getElementById('year').value)
            })
        });
        const alert = document.getElementById('alert');
        alert.classList.remove('d-none', 'alert-success', 'alert-danger');
        if (res.ok) {
            const data = await res.json();
            alert.classList.add('alert-success');
            alert.textContent = 'Olympics created! ID: ' + data.id;
        } else {
            alert.classList.add('alert-danger');
            alert.textContent = 'Failed to create Olympics.';
        }
    }
</script>
</body>
</html>
