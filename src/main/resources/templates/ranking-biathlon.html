<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Biathlon Ranking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f0f4f8; }
        .header { background: linear-gradient(135deg, #1a1a2e, #1a6b3c);
            color: white; padding: 40px 0; margin-bottom: 40px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .gold { background-color: #fff8e1; }
        .silver { background-color: #f5f5f5; }
        .bronze { background-color: #fbe9e7; }
    </style>
</head>
<body>
<div class="header text-center">
    <h1 class="fw-bold">🎯 <span th:text="${competition.name}"></span></h1>
    <p class="lead">Final Ranking</p>
    <a href="/" class="btn btn-outline-light">← Back</a>
</div>
<div class="container">
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Place</th>
                    <th>Athlete</th>
                    <th>Country</th>
                    <th class="text-end">Ski time</th>
                    <th class="text-end">Missed</th>
                    <th class="text-end">Penalty</th>
                    <th class="text-end">Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r, i : ${results}"
                    th:classappend="${i.index == 0} ? 'gold' : (${i.index == 1} ? 'silver' : (${i.index == 2} ? 'bronze' : ''))">
                    <td class="align-middle fw-bold">
                        <span th:if="${i.index == 0}">🥇</span>
                        <span th:if="${i.index == 1}">🥈</span>
                        <span th:if="${i.index == 2}">🥉</span>
                        <span th:if="${i.index > 2}" th:text="${i.count}"></span>
                    </td>
                    <td class="align-middle" th:text="${r.athlete.name}"></td>
                    <td class="align-middle" th:text="${r.athlete.country}"></td>
                    <td class="align-middle text-end" th:text="${r.skiTime}"></td>
                    <td class="align-middle text-end" th:text="${r.missedShots}"></td>
                    <td class="align-middle text-end" th:text="${r.penaltyTime}"></td>
                    <td class="align-middle text-end fw-bold" th:text="${r.totalTime}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="7" class="text-center text-muted py-4">No results yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
